<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1f17">
    <title>Visualizador AR | Senegal GO</title>
    <link rel="stylesheet" href="styles/main.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            display: grid;
            min-height: 100vh;
            padding: 16px;
            background:
                radial-gradient(circle at top, rgba(240, 179, 35, 0.18), transparent 34%),
                var(--green-950);
        }

        .viewer-shell {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 14px;
            width: min(980px, 100%);
            min-height: calc(100vh - 32px);
            margin: auto;
        }

        .viewer-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: white;
        }

        .viewer-title {
            min-width: 0;
        }

        .viewer-title h1 {
            margin: 8px 0 0;
            overflow: hidden;
            font-size: clamp(1.35rem, 7vw, 2.3rem);
            line-height: 1;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .back-link {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            color: white;
            font-weight: 900;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
        }

        .viewer-container {
            position: relative;
            overflow: hidden;
            min-height: 62vh;
            background:
                radial-gradient(circle at center, rgba(16, 167, 101, 0.16), transparent 46%),
                #f7f5ec;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
        }

        model-viewer {
            width: 100%;
            height: 100%;
            min-height: 62vh;
        }

        #ar-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 50px;
            padding: 0 18px;
            color: white;
            font-weight: 900;
            background: linear-gradient(135deg, var(--green-600), var(--green-500));
            border: 0;
            border-radius: 16px;
            box-shadow: 0 16px 34px rgba(8, 120, 76, 0.3);
        }

        .loading-cover {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: #fffaf0;
            transition: opacity 0.4s ease;
        }

        .viewer-note {
            margin: 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.88rem;
            line-height: 1.5;
            text-align: center;
        }

        body.minimal-mode {
            display: block;
            padding: 0;
            background: #ffffff;
        }

        body.minimal-mode .viewer-shell {
            width: 100vw;
            min-height: 100vh;
            gap: 0;
        }

        body.minimal-mode .viewer-topbar,
        body.minimal-mode .viewer-note {
            display: none;
        }

        body.minimal-mode .viewer-container,
        body.minimal-mode model-viewer {
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <main class="viewer-shell">
        <header class="viewer-topbar">
            <div class="viewer-title">
                <span class="eyebrow">Projeção AR</span>
                <h1 id="model-name-ar">Carregando...</h1>
            </div>
            <a href="index.html" class="back-link">Voltar</a>
        </header>

        <section class="viewer-container" aria-label="Visualizador 3D">
            <div id="loading" class="loading-cover">Preparando holograma</div>
            <model-viewer id="viewer" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
                alt="Modelo 3D Senegal GO" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate
                shadow-intensity="1" environment-image="neutral" exposure="1" touch-action="pan-y">
                <button slot="ar-button" id="ar-button">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                        <path d="M7 6V4H4v3h2M17 6V4h3v3h-2M7 18v2H4v-3h2M17 18v2h3v-3h-2" />
                        <rect x="9" y="9" width="6" height="6" rx="1" />
                    </svg>
                    Ver no meu espaço
                </button>
            </model-viewer>
        </section>

        <p class="viewer-note">Mova o celular devagar para detectar o chão e posicionar o objeto.</p>
    </main>

    <script src="js/db.js"></script>
    <script src="js/viewer.js"></script>
</body>

</html>
