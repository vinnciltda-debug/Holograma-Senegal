<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador AR | Holografix</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <!-- Loads <model-viewer> -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .viewer-container {
            width: 95%;
            max-width: 900px;
            height: 75vh;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #f1f5f9;
        }

        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
            white-space: nowrap;
        }

        .model-info-overlay {
            position: absolute;
            top: 50px;
            left: 50px;
            right: 50px;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .model-info-overlay h2 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin: 12px 0 0 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            line-height: 1;
        }

        /* Minimal Mode - Foco total na projeção */
        body.minimal-mode {
            background: #fff;
        }

        body.minimal-mode .viewer-container {
            width: 100vw;
            height: 100vh;
            max-width: none;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            border-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body.minimal-mode #ar-button {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            padding: 1.5rem 3rem;
            font-size: 1.2rem;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.4);
        }

        body.minimal-mode .loading-cover p {
            display: none;
        }

        .loading-cover {
            position: absolute;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.6s ease;
        }
    </style>
</head>

<body>
    <div class="viewer-container">
        <!-- Loading -->
        <div id="loading" class="loading-cover">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p class="text-muted small fw-bold text-uppercase" style="letter-spacing: 2px;">Preparando Holograma...</p>
        </div>

        <div class="model-info-overlay">
            <div
                style="pointer-events: none; text-align: left; display: flex; flex-direction: column; align-items: flex-start;">
                <span class="badge-model" style="margin-left: 0;">PROJEÇÃO AR</span>
                <h2 id="model-name-ar">Carregando...</h2>
            </div>
            <!-- Botão de Voltar único e funcional -->
            <a href="index.html" class="btn btn-premium rounded-pill px-4 shadow-sm"
                style="pointer-events: auto; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                    class="me-2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                VOLTAR
            </a>
        </div>



        <model-viewer id="viewer" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
            alt="Modelo 3D Holografix" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate
            shadow-intensity="1" environment-image="neutral" exposure="1" touch-action="pan-y">

            <button slot="ar-button" id="ar-button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M7 6V4H4V7H6" />
                    <path d="M17 6V4H20V7H18" />
                    <path d="M7 18V20H4V17H6" />
                    <path d="M17 18V20H20V17H18" />
                    <rect x="9" y="9" width="6" height="6" rx="1" />
                </svg>
                VER NO MEU ESPAÇO
            </button>
        </model-viewer>
    </div>

    <div class="mt-4 text-center px-4">
        <p class="text-muted small">Mova o celular para detectar o chão e projetar o objeto.</p>
    </div>

    <script src="js/db.js"></script>
    <script src="js/viewer.js"></script>

</body>

</html>
