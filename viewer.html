<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Holografix</title>
    <link rel="stylesheet" href="styles/main.css">
    <!-- Loads <model-viewer> for modern browsers -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 1rem;
        }

        .viewer-container {
            width: 100%;
            height: 70vh;
            position: relative;
            background: radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.1) 0%, transparent 70%);
            border-radius: 2rem;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        #ar-button {
            background-color: var(--primary);
            border-radius: 12px;
            border: none;
            position: absolute;
            bottom: 24px;
            right: 24px;
            padding: 12px 24px;
            font-weight: 700;
            color: black;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        #ar-button:active {
            transform: scale(0.95);
        }

        .model-info {
            position: absolute;
            top: 24px;
            left: 24px;
            pointer-events: none;
        }

        .model-info h2 {
            font-size: 1.2rem;
            margin-bottom: 4px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .model-info p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .instructions {
            margin-top: 2rem;
            text-align: center;
            max-width: 300px;
        }

        .instructions p {
            color: #888;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="bg-mesh"></div>

    <div class="viewer-container">
        <div id="loading" class="loading-overlay">
            <div class="spinner"></div>
        </div>

        <!-- The 3D Model Viewer -->
        <model-viewer id="viewer" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
            ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz" alt="Um modelo 3D de um Astronauta" ar
            ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate shadow-intensity="1"
            environment-image="neutral" exposure="1" touch-action="pan-y">

            <div class="model-info">
                <h2>Astronauta Holográfico</h2>
                <p>Google Model-Viewer API</p>
            </div>

            <button slot="ar-button" id="ar-button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M7 6V4H4V7H6" />
                    <path d="M17 6V4H20V7H18" />
                    <path d="M7 18V20H4V17H6" />
                    <path d="M17 18V20H20V17H18" />
                    <rect x="9" y="9" width="6" height="6" rx="1" />
                </svg>
                PROJETAR EM AR
            </button>
        </model-viewer>
    </div>

    <div class="instructions">
        <p>Use um dedo para girar, dois dedos para mover e pinça para zoom.</p>
        <p style="margin-top: 0.5rem; color: var(--primary); font-weight: bold;">Toque no botão para ver no seu espaço!
        </p>
    </div>

    <a href="index.html"
        style="margin-top: 2rem; color: #666; text-decoration: none; font-size: 0.8rem; border-bottom: 1px solid #333;">Voltar
        para Início</a>

    <script>
        const modelViewer = document.querySelector('#viewer');
        const loading = document.querySelector('#loading');
        const modelTitle = document.querySelector('.model-info h2');

        const DB_NAME = 'HolografixDB';
        const STORE_NAME = 'models';

        async function loadModel() {
            const hasCustom = sessionStorage.getItem('hasCustomModel');
            if (hasCustom) {
                const request = indexedDB.open(DB_NAME, 1);
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const getRequest = store.get('currentModel');

                    getRequest.onsuccess = () => {
                        const blob = getRequest.result;
                        if (blob) {
                            modelViewer.src = URL.createObjectURL(blob);
                            const modelName = sessionStorage.getItem('modelName');
                            if (modelName) modelTitle.textContent = modelName;
                        }
                    };
                };
            }
        }
        loadModel();

        modelViewer.addEventListener('load', () => {
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 500);
        });

        modelViewer.addEventListener('error', (e) => {
            console.error('Erro ao carregar modelo:', e);
            if (modelViewer.src !== 'https://modelviewer.dev/shared-assets/models/Astronaut.glb') {
                alert('Falha ao carregar o modelo 3D. Verifique se o arquivo GLB/GLTF está íntegro.');
            }
        });
    </script>


</body>

</html>
