<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo VR Estereoscópico</title>
    <link rel="stylesheet" href="styles/main.css">
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        .vr-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .eye {
            flex: 1;
            height: 100%;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="controls">
        <a href="index.html" class="btn btn-secondary">Sair</a>
    </div>
    <div class="vr-container">
        <div id="left-eye" class="eye"></div>
        <div id="right-eye" class="eye"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, model, mixer;
        const clock = new THREE.Clock();
        const renderers = {};
        const cameras = {};

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            const ambientLight = new THREE.AmbientLight(0xffffff, 2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x00f2ff, 3);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            const loader = new GLTFLoader();
            const DB_NAME = 'HolografixDB';
            const STORE_NAME = 'models';

            async function loadModel() {
                const hasCustom = sessionStorage.getItem('hasCustomModel');
                const defaultModel = 'https://modelviewer.dev/shared-assets/models/Astronaut.glb';

                if (hasCustom) {
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onsuccess = (e) => {
                        const db = e.target.result;
                        const transaction = db.transaction(STORE_NAME, 'readonly');
                        const store = transaction.objectStore(STORE_NAME);
                        const getRequest = store.get('currentModel');

                        getRequest.onsuccess = () => {
                            const blob = getRequest.result;
                            if (blob) {
                                const url = URL.createObjectURL(blob);
                                loader.load(url, (gltf) => setupModel(gltf));
                            } else {
                                loader.load(defaultModel, (gltf) => setupModel(gltf));
                            }
                        };
                    };
                } else {
                    loader.load(defaultModel, (gltf) => setupModel(gltf));
                }
            }

            function setupModel(gltf) {
                model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 3 / maxDim;
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale));
                scene.add(model);

                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    mixer.clipAction(gltf.animations[0]).play();
                }
            }
            loadModel();


            // Set up dual cameras (IPD - Interpupillary distance)
            const ipd = 0.064; // Standard IPD in meters

            ['left-eye', 'right-eye'].forEach(id => {
                const container = document.getElementById(id);
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);
                renderers[id] = renderer;

                const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.z = 8;
                camera.position.x = (id === 'left-eye' ? -ipd / 2 : ipd / 2);
                cameras[id] = camera;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            if (model) {
                model.rotation.y += 0.005;
            }

            ['left-eye', 'right-eye'].forEach(id => {
                renderers[id].render(scene, cameras[id]);
            });
        }

        window.addEventListener('resize', () => {
            ['left-eye', 'right-eye'].forEach(id => {
                const container = document.getElementById(id);
                renderers[id].setSize(container.clientWidth, container.clientHeight);
                cameras[id].aspect = container.clientWidth / container.clientHeight;
                cameras[id].updateProjectionMatrix();
            });
        });

        init();
    </script>
</body>

</html>
