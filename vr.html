<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo VR Estereoscópico</title>
    <link rel="stylesheet" href="styles/main.css">
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            overflow: hidden;
        }

        .vr-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .eye {
            flex: 1;
            height: 100%;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="controls">
        <a href="index.html" class="btn btn-premium rounded-pill px-5 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            SAIR DO MODO VR
        </a>
    </div>
    <div class="vr-container">
        <div id="left-eye" class="eye"></div>
        <div id="right-eye" class="eye"></div>
    </div>

    <script src="js/db.js"></script>
    <script type="module" src="js/vr.js"></script>

</body>

</html>
