<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Modo VR Estereoscópico | Senegal GO</title>
    <link rel="stylesheet" href="styles/main.css">
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>
    <style>
        body {
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #121212 0%, #000 68%);
        }

        .vr-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100vw;
            height: 100vh;
        }

        .eye {
            position: relative;
            height: 100%;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.12);
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .controls {
            position: fixed;
            left: 50%;
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 10;
            transform: translateX(-50%);
        }

        .controls .btn-premium {
            min-width: 150px;
            padding: 0 18px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="controls">
        <a href="index.html" class="btn-premium">Sair do VR</a>
    </div>
    <div class="vr-container">
        <div id="left-eye" class="eye"></div>
        <div id="right-eye" class="eye"></div>
    </div>

    <script src="js/db.js"></script>
    <script type="module" src="js/vr.js"></script>
</body>

</html>
