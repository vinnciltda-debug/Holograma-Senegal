<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Pirâmide Holográfica</title>
    <link rel="stylesheet" href="styles/main.css">
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>
    <style>
        body {
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .view {
            position: absolute;
            width: 300px;
            height: 300px;
        }

        /* Position the 4 views for the pyramid hologram */
        #top {
            top: 0;
            left: 50%;
            transform: translateX(-50%) rotate(180deg);
        }

        #bottom {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) rotate(0deg);
        }

        #left {
            left: 0;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
        }

        #right {
            right: 0;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
        }

        canvas {
            display: block;
        }

        .center-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
        }

        .back-btn-wrapper {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div class="back-btn-wrapper">
        <a href="index.html" class="btn btn-premium rounded-pill px-4 shadow-lg" style="text-decoration: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            VOLTAR AO PAINEL
        </a>
    </div>
    <div class="center-mark"></div>

    <div id="container">
        <div id="top" class="view"></div>
        <div id="bottom" class="view"></div>
        <div id="left" class="view"></div>
        <div id="right" class="view"></div>
    </div>

    <script src="js/db.js"></script>
    <script type="module" src="js/pyramid.js"></script>

</body>

</html>
