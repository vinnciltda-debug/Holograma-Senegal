<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Modo Pirâmide Holográfica | Senegal GO</title>
    <link rel="stylesheet" href="styles/main.css">
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .view {
            position: absolute;
            width: min(42vw, 42vh, 320px);
            height: min(42vw, 42vh, 320px);
        }

        #top {
            top: max(10px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) rotate(180deg);
        }

        #bottom {
            bottom: max(10px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
        }

        #left {
            top: 50%;
            left: max(10px, env(safe-area-inset-left));
            transform: translateY(-50%) rotate(90deg);
        }

        #right {
            top: 50%;
            right: max(10px, env(safe-area-inset-right));
            transform: translateY(-50%) rotate(-90deg);
        }

        canvas {
            display: block;
        }

        .center-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.24);
            border-radius: 999px;
            transform: translate(-50%, -50%);
        }

        .back-link {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: 50%;
            z-index: 10;
            min-height: 44px;
            padding: 0 16px;
            transform: translateX(-50%);
        }

        @media (max-width: 560px) {
            .back-link {
                left: 14px;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="btn-premium back-link">Voltar</a>
    <div class="center-mark"></div>
    <div id="container">
        <div id="top" class="view"></div>
        <div id="bottom" class="view"></div>
        <div id="left" class="view"></div>
        <div id="right" class="view"></div>
    </div>

    <script src="js/db.js"></script>
    <script type="module" src="js/pyramid.js"></script>
</body>

</html>
